<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuaAI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #1f2937;
        }

        h1 {
            margin: 0;
        }

        .chat {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .mensagem {
            background: #1f2937;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .entrada {
            display: flex;
            gap: 10px;
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            max-width: 670px;
            margin: auto;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>🤖 LuaAI</h1>
        <p>Seu assistente para programação</p>
    </header>

    <main class="chat">
        <div class="mensagem">
            👋 Olá! Eu sou a LuaAI.
            <br><br>
            Em breve vou poder ajudar você a criar códigos em Lua!
        </div>
    </main>

    <div class="entrada">
        <input type="text" placeholder="Digite sua mensagem...">
        <button>Enviar</button>
    </div>

</body>
</html>
